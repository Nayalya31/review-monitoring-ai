services:
  worker:
    build: .
    restart: unless-stopped
    env_file: ${REVIEWS_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /service/data/reviews.sqlite3
    # UID 33 matches www-data on the audited Ubuntu host; override locally if needed.
    user: "${REVIEWS_UID:-33}:${REVIEWS_GID:-33}"
    volumes:
      - ${REVIEWS_DATA_DIR:-./data}:/service/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.35
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
